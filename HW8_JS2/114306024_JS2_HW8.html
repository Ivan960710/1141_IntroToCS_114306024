<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114306024_JS2_HW8 - Calculator</title>
    <link rel="stylesheet" href="114306024_JS2_HW8.css">
</head>
<body>

    <main class="container">
        <h1>JS Calculator</h1>

        <section class="form-section">
            <label for="num1">Number 1：</label>
            <input id="num1" type="number" step="0.01" placeholder="輸入第一個數字">

            <label for="num2">Number 2：</label>
            <input id="num2" type="number" step="0.01" placeholder="輸入第二個數字">

            <label for="op">Operator：</label>
            <select id="op">
                <option value="+">＋ 加法</option>
                <option value="-">－ 減法</option>
                <option value="*">× 乘法</option>
                <option value="/">÷ 除法</option>
            </select>

            <button id="calcBtn">Calculate</button>

            <p id="msg"></p>
        </section>

        <section class="result-section">
            <h2>Result=</h2>
            <div id="result">—</div>
        </section>
    </main>

    <script src="114306024_JS2_HW8.js"></script>
</body>
</html>
